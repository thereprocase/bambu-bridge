name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-setup:
    name: Windows Orca setup helper
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run pytest tests/test_orca_windows_setup.py -q --junitxml=windows-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-setup-results
          path: windows-results.xml
          if-no-files-found: ignore
  test:
    name: pytest + ruff + mypy
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (frozen)
        # Falls back to non-frozen sync if no lockfile is committed yet —
        # remove the conditional once uv.lock lands.
        run: |
          if [ -f uv.lock ]; then
            uv sync --frozen --extra dev
          else
            uv sync --extra dev
          fi

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest -q --junitxml=test-results.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Camera streaming parser
        run: node --test tests/camera-stream.test.mjs

      - name: Browser toolhead regressions
        run: node --test tests/viewer_toolhead_motion.test.cjs tests/viewer_toolhead_state.test.cjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
